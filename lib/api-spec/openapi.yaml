openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: triage
    description: Classificação de solicitações
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /triagem:
    post:
      operationId: submitTriage
      tags: [triage]
      summary: Classify a request through the n8n webhook
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TriageInput"
      responses:
        "200":
          description: Request classified by n8n
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TriageResult"
        "400":
          description: Invalid request fields
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TriageError"
        "502":
          description: n8n did not return a valid classification
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TriageError"
        "503":
          description: n8n integration is not configured
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TriageError"
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    TriageInput:
      type: object
      additionalProperties: false
      properties:
        nome:
          type: string
          minLength: 1
          maxLength: 100
        mensagem:
          type: string
          minLength: 1
          maxLength: 2000
      required:
        - nome
        - mensagem
    TriageResult:
      type: object
      properties:
        Nome:
          type: string
        Mensagem:
          type: string
        Categoria:
          type: string
          enum:
            - Acesso ao portal
            - Documentos e certidões
            - Empréstimo consignado
            - Processos administrativos
            - A classificar
        Status:
          type: string
        Resposta_sugerida:
          type: [string, "null"]
      required:
        - Nome
        - Mensagem
        - Categoria
        - Status
    TriageError:
      type: object
      properties:
        error:
          type: string
      required:
        - error

